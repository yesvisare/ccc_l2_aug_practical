[pytest]
# Pytest configuration for M6.4 Compliance & Audit Logging

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Python path (include src for package imports)
pythonpath = .

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    smoke: Smoke tests that run without external dependencies
    integration: Integration tests requiring Elasticsearch
